          - { label: 'Body', name: 'body', widget: 'markdown' }
          - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }

      - file: "content/inspirations/_index.md"
        label: "Inspirations" 
        name: "inspirations"
        delete: false
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
          - label: 'SEO (image)'
            name: 'images'
            widget: 'list'
            collapsed: true
