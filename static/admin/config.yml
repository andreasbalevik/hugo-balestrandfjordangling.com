local_backend: false
editor:
  preview: false
site_url: https://balestrandfjordangling.com
display_url: https://balestrandfjordangling.com
backend:
  name: git-gateway
  branch: master
media_folder: /assets/images
public_folder: 'images'
collections:
  - name: 'activities'
    label: 'Activities'
    label_singular: 'Activity'
    description: 'Guided tours and rentals shown on the activities overview.'
    folder: 'content/activities'
    path: "{{slug}}/index"
    preview_path: "activities/{{dirname}}"
    summary: "{{quality}} - {{title}}"
    sortable_fields: ['title', 'quality']
    view_filters:
      - { label: 'Basic', field: quality, pattern: 'BASIC' }
      - { label: 'Legacy', field: quality, pattern: 'LEGACY' }
      - { label: 'Lifestyle', field: quality, pattern: 'LIFESTYLE' }
      - { label: 'Premium', field: quality, pattern: 'PREMIUM' }
      - { label: 'Escape', field: quality, pattern: 'ESCAPE' }
      - { label: 'Sporty', field: quality, pattern: 'SPORTY' }
      - { label: 'Bike rental', field: quality, pattern: 'BIKE RENTAL' }
      - { label: 'Guided bike tour', field: quality, pattern: 'GUIDED BIKE TOUR' }
      - { label: 'Local fisherman', field: quality, pattern: 'Local Fisherman' }
      - { label: 'Go Viking & Springfulness', field: quality, pattern: 'Go Viking & Springfulness' }
      - { label: 'Work', field: quality, pattern: 'WORK' }
    create: true
    slug: '{{slug}}-{{minute}}{{second}}'
    filter:
          field: cms
          value: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Quality', name: 'quality', widget: 'string' }
      - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
      - label: "Aliases"
        name: "aliases"
        widget: "list"
        required: false
        hint: "Alternativ url for aktiviteten"
        field:
          label: "Alias"
          name: "alias"
          widget: "string"
      - label: 'Images'
        name: 'images'
        widget: 'list'
        collapsed: true
        min: 1
        max: 10
        summary: '{{fields.src}}'
        media_folder: /assets/images
        public_folder: 'images'
        fields:
          - { label: 'Image Source', name: 'src', widget: 'image', required: true }
          - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }

      - label: 'Categories'
        name: 'tags'
        widget: 'select'
        multiple: true
        options:
          - { label: 'Business and Pleasure', value: 'business-and-pleasure' }
          - { label: 'Bike and Hike', value: 'bike-and-hike' }
          - { label: 'Family and Friends', value: 'family-and-friends' }
        required: true

      - label: "Information"
        name: "information"
        widget: "object"
        collapsed: true
        fields:
          - label: "Options"
            name: "options"
            widget: "object"
            fields:
              - {label: Add global practical, name: global_practical, widget: boolean, default: false, required: false}
              - {label: "Add global practical (bike)", name: global_bike_practical, widget: boolean, default: false, required: false}
              - {label: Add global included, name: global_included, widget: boolean, default: false, required: false}
              - {label: Varde Experience Quality, name: varde_experience_quality, widget: boolean, default: false, required: false}
          - label: "Practical"
            name: "practical"
            widget: "list"
            summary: '{{fields.info}}'
            field: {label: Info,name: info,widget: string}
          - label: "Included"
            name: "included"
            widget: "list"
            summary: '{{fields.info}}'
            field: {label: Info,name: info,widget: string}

      - label: "Product info"
        name: "product_info"
        widget: "object"
        collapsed: true
        fields: 
          - label: "Duration"
            name: "duration"
            widget: 'object'
            collapse: true
            fields: 
              - label: 'Hours'
                name: 'hours'
                widget: 'select'
                required: true
                options:
                  - { label: '0 hours', value: 0 }
                  - { label: '1 hour', value: 1 }
                  - { label: '2 hours', value: 2 }
                  - { label: '3 hours', value: 3 }
                  - { label: '4 hours', value: 4 }
                  - { label: '5 hours', value: 5 }
                  - { label: '6 hours', value: 6 }
                  - { label: '7 hours', value: 7 }
                  - { label: '8 hours', value: 8 }
              - label: 'Minutes'
                name: 'minutes'
                required: false
                widget: 'select'
                options:
                  - { label: '0 minutes', value: 0 }
                  - { label: '15 minutes', value: 15 }
                  - { label: '30 minutes', value: 30 }
                  - { label: '45 minutes', value: 45 }

          - label: 'Max Persons'
            name: 'persons'
            widget: 'select'
            required: true
            multiple: false
            hint: "Shown as the group-size badge on activity cards. Booking choices and displayed capacity come from the price rows below; keep those rows in ascending order."
            options:
              - { label: '1', value: '1' }
              - { label: '2', value: '2' }
              - { label: '3', value: '3' }
              - { label: '4', value: '4' }
              - { label: '5', value: '5' }
              - { label: '6', value: '6' }
              - { label: '7', value: '7' }
              - { label: '8', value: '8' }
          
          - label: "Total price by group size"
            name: "prices"
            widget: "list"
            collapsed: true
            min: 1
            max: 8
            summary: '{{fields.person_number}} guests / {{fields.price}} NOK'
            fields:
              - label: "Person Number"
                name: "person_number"
                widget: "number"
                value_type: "int"
                hint: "Keep the rows in ascending order by person number. This row number decides which total applies to a booking of that group size."
              - label: "Total price (NOK)"
                name: "price"
                widget: "number"
                value_type: "int"
                hint: "Total price for this group size in NOK, not a per-person rate."

      - { label: 'Body', name: 'body', widget: 'markdown' }
      - label: 'Frequently Asked Questions (optional)'
        name: 'faqItems'
        widget: 'list'
        required: false
        collapsed: true
        summary: '{{fields.question}}'
        hint: 'Add FAQ items that will appear as an accordion on this activity page'
        fields:
          - { label: 'Question', name: 'question', widget: 'string' }
          - { label: 'Answer', name: 'answer', widget: 'markdown' }
      - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }
      - { label: 'Cms', name: 'cms', widget: 'hidden', default: true }

  - name: 'inspirations'
    label: 'Inspirations'
    label_singular: 'Inspiration'
    description: 'Editorial stories that link readers to related activities.'
    folder: 'content/inspirations'
    path: "{{slug}}/index"
    preview_path: "inspirations/{{dirname}}"
    summary: "{{title}}"
    sortable_fields: ['title']
    create: true
    slug: '{{slug}}-{{minute}}{{second}}'
    filter:
          field: cms
          value: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
      - label: "Aliases"
        name: "aliases"
        widget: "list"
        required: false
        hint: "Peke gamle inspirasjon til denne inspirasjonen"
        field:
          label: "Alias"
          name: "alias"
          widget: "string"
      - label: 'Images'
        name: 'images'
        widget: 'list'
        collapsed: true
        min: 1
        max: 10
        summary: '{{fields.src}}'
        media_folder: /assets/images
        public_folder: 'images'
        fields:
          - { label: 'Image Source', name: 'src', widget: 'image', required: true }
          - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }

      - { label: 'Body', name: 'body', widget: 'markdown' }
      - label: "Related activities"
        name: "related_activities"
        widget: "list"
        summary: '{{fields.title}}'
        allow_add: true
        required: false
        min: 1
        max: 3
        field: {label: Activity,name: related_activities,widget: relation,collection: activities,search_fields: ["title"],value_field: '{{slug}}',display_fields: ["quality","title"]}
      - label: 'Frequently Asked Questions (optional)'
        name: 'faqItems'
        widget: 'list'
        required: false
        collapsed: true
        summary: '{{fields.question}}'
        hint: 'Add FAQ items that will appear as an accordion on this inspiration page'
        fields:
          - { label: 'Question', name: 'question', widget: 'string' }
          - { label: 'Answer', name: 'answer', widget: 'markdown' }
      - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }
      - { label: 'Cms', name: 'cms', widget: 'hidden', default: true }

  - name: 'pages'
    label: "Pages"
    files:
      - file: "content/_index.md"
        label: "Frontpage" 
        name: "frontpage"
        delete: false
        fields:
          - {label: Title, name: title, widget: string}
          - { label: 'Description', name: 'description', widget: 'text', pattern: ['^.{0,397}$', 'Max 397 characters'] }
          - { label: 'Action button', name: 'action_button', widget: 'string'}
          - label: 'Banner Image'
            name: 'images'
            widget: 'list'
            collapsed: true
            min: 1
            max: 1
            allow_multiple: false
            summary: '{{fields.src}}'
            fields:
              - { label: 'Image Source', name: 'src', widget: 'image', required: true }
              - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }
          
          - label: "Categories"
            name: "categories"
            widget: "object"
            collapsed: true
            fields: 
              - { label: 'Categories title', name: 'title', widget: 'string' }

          - label: "Recommended activities"
            name: "recommended"
            widget: "object"
            collapsed: true
            fields: 
              - { label: 'Recommended title', name: 'title', widget: 'string' }
              - label: "Recommended activities"
                name: "activities"
                widget: "list"
                summary: '{{fields.title}}'
                allow_add: true
                min: 3
                max: 3
                field: {label: Activity,name: recommended_activities,widget: relation,collection: activities,search_fields: ["title"],value_field: '{{slug}}',display_fields: ["quality","title"]}
          
          - label: "Why Choose Us (USP)"
            name: "usp"
            widget: "object"
            collapsed: true
            fields:
              - { label: 'Title', name: 'title', widget: 'string', default: 'Why Explore with Captain Tor?' }
              - label: "Items"
                name: "items"
                widget: "list"
                min: 3
                max: 3
                fields:
                  - { label: 'Title', name: 'title', widget: 'string' }
                  - { label: 'Description', name: 'description', widget: 'text' }
                  - { label: 'Icon (SVG path d)', name: 'icon', widget: 'hidden', hint: 'Paste the SVG path d attribute here' }

          - label: "Brand statement"
            name: "statement"
            widget: "object"
            collapsed: true
            fields:
              - { label: 'Quote', name: 'quote', widget: 'text', default: 'Simplicity creates emotions. No middlemen, no scripts — just the raw luxury of the Sognefjord, shared by the local captain who lives it.' }
              - { label: 'Source', name: 'source', widget: 'string', default: 'Captain Tor' }

          - label: "Visual Gallery"
            name: "gallery"
            widget: "object"
            collapsed: true
            fields:
              - { label: 'Title', name: 'title', widget: 'string', default: 'Moments from the Fjord' }
              - { label: 'Instagram URL', name: 'instagram_url', widget: 'hidden', default: 'https://www.instagram.com/balestrandfjordangling/' }
              - label: "Images"
                name: "images"
                widget: "list"
                collapsed: true
                min: 3
                max: 10
                summary: '{{fields.src}}'
                fields:
                  - { label: 'Image', name: 'src', widget: 'image' }
                  - { label: 'Alt Text', name: 'alt', widget: 'string', hint: "Describe what is in the image for people who cannot see it." }


          - label: "Recommended inspirations"
            name: "inspirations"
            widget: "object"
            collapsed: true
            fields: 
              - { label: 'Inspiration title', name: 'title', widget: 'string' }
              - { label: 'Short description', name: 'description', widget: 'text', required: false, hint: "Optional text shown below the inspirations heading on the frontpage." }
              - label: "Recommended inspirations"
                name: "inspirations"
                widget: "list"
                summary: '{{fields.title}}'
                allow_add: true
                min: 2
                max: 2
                field: {label: Inspiration,name: recommended_inspirations,widget: relation,collection: inspirations,search_fields: ["title"],value_field: '{{slug}}',display_fields: ["title"]}

      - file: "content/about/_index.md"
        label: "About" 
        name: "About"
        delete: false
        fields:
          - {label: Title, name: title, widget: string}
          - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,200}$', 'Max 200 characters'], hint: "Short summary shown under the page title in search results and social previews. Max 200 characters." }
          - label: 'Banner Image'
            name: 'images'
            widget: 'list'
            collapsed: true
            min: 1
            max: 1
            allow_multiple: false
            summary: '{{fields.src}}'
            fields:
              - { label: 'Image Source', name: 'src', widget: 'image', required: true }
              - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }
          - { label: 'Body', name: 'body', widget: 'markdown' }
          - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }

      - file: "content/tags/bike-and-hike/_index.md"
        label: "Bike and hike" 
        name: "bike-and-hike"
        delete: false
        fields:
          - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
          - label: 'SEO (image)'
            name: 'images'
            widget: 'list'
            collapsed: true
            min: 1
            max: 1
            allow_multiple: false
            summary: '{{fields.src}}'
            fields:
              - { label: 'Image Source', name: 'src', widget: 'image', required: true }
              - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }
          - { label: 'Body', name: 'body', widget: 'markdown' }
          - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }


      - file: "content/tags/business-and-pleasure/_index.md"
        label: "Business and pleasure" 
        name: "business-and-pleasure"
        delete: false
        fields:
          - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
          - label: 'SEO (image)'
            name: 'images'
            widget: 'list'
            collapsed: true
            min: 1
            max: 1
            allow_multiple: false
            summary: '{{fields.src}}'
            fields:
              - { label: 'Image Source', name: 'src', widget: 'image', required: true }
              - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }
          - { label: 'Body', name: 'body', widget: 'markdown' }
          - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }


      - file: "content/tags/family-and-friends/_index.md"
        label: "Family and friends" 
        name: "family-and-friends"
        delete: false
        fields:
          - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
          - label: 'SEO (image)'
            name: 'images'
            widget: 'list'
            collapsed: true
            min: 1
            max: 1
            allow_multiple: false
            summary: '{{fields.src}}'
            fields:
              - { label: 'Image Source', name: 'src', widget: 'image', required: true }
              - { label: 'Image Alt', name: 'alt', widget: 'string', required: false, hint: "Describe what is in the image for people who cannot see it. Leave empty only for purely decorative images." }
          - { label: 'Body', name: 'body', widget: 'markdown' }
          - { label: "Keywords (optional)", name: "keywords", widget: "list", required: false, hint: "Optional metadata only. Search engines ignore the meta keywords tag, so this does not affect search ranking." }


      - file: "content/activities/_index.md"
        label: "Activities" 
        name: "activities"
        delete: false
        fields:
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Short description', name: 'description', widget: 'text', pattern: ['^.{0,160}$', 'Max 160 characters'], hint: "One or two sentences shown under the page title in search results and social previews. Max 160 characters." }
          - label: 'SEO (image)'
            name: 'images'
            widget: 'list'
            collapsed: true
            min: 1
