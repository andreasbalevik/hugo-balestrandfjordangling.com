{{ define "main" }}

<!-- Activities Landing Page Hero with Tag Buttons -->
{{ if .Content }}
<section class="bg-white">
    <div class="container">
        <p class="text-sm font-semibold text-primary uppercase tracking-widest mb-4">Activities</p>
        <h1 class="mt-0 mb-5 md:mb-6 text-3xl md:text-4xl lg:text-5xl font-medium leading-[1.2] tracking-tight text-balance text-gray-900">{{ .Title }}</h1>
        <div class="w-12 h-1 bg-primary rounded-full mb-5 md:mb-6"></div>
        <div class="text-lg md:text-xl leading-relaxed mb-10 md:mb-12 max-w-none">
            {{ .Content }}
        </div>

        <!-- Tag Buttons -->
        {{ partial "components/tag-buttons" . }}
    </div>
</section>
{{ end }}

<section class="bg-fjord-light">
<div class="container">
    <div class="flex items-center gap-3 mb-8">
        <div class="relative">
            <button id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
                class="inline-flex items-center gap-2 rounded-lg px-4 py-2 border border-fjord-pale bg-white text-sm font-semibold hover:bg-fjord-light transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
                type="button"
                aria-label="Filter activities by category"
                aria-haspopup="listbox"
                aria-expanded="false">
                <span>All activities</span>
                <svg class="w-4 h-4 text-gray-700" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
                </svg>
            </button>

            {{ partial "components/tag-dropdown-menu" (dict "activePermalink" .RelPermalink) }}
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 justify-items-center">
        {{ range .Pages.ByLastmod.Reverse }}
            {{ .Render "li" }}
        {{ end }}
    </div>
</div>
</section>

{{ end }}
