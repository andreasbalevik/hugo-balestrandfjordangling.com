{{ define "main" }}

<!-- Featured Landing Page Hero -->
<section class="bg-white">
    <div class="container">
        <p class="text-sm font-semibold text-primary uppercase tracking-widest mb-4">Featured</p>
        <h1 class="mt-0 mb-5 md:mb-6 text-3xl md:text-4xl lg:text-5xl font-medium leading-[1.2] tracking-tight text-balance text-gray-900">{{ .Title }}</h1>
        <div class="w-12 h-1 bg-primary rounded-full mb-5 md:mb-6"></div>
        {{ with .Content }}
        <div class="prose md:prose-lg lg:prose-xl max-w-3xl mb-2 prose-p:leading-relaxed">{{ . }}</div>
        {{ end }}
    </div>
</section>

<!-- Featured Items — flex-wrap keeps cards left-aligned instead of stretching
     across empty grid columns when there are only one or two items. -->
<section class="bg-fjord-light">
    <div class="container">
        <div class="flex flex-wrap gap-6 md:gap-8">
            {{ range .Pages }}
            <a href="{{ .Permalink }}" class="block w-full sm:w-[calc(50%-0.75rem)] md:w-[calc(50%-1rem)] lg:w-[340px] bg-white border border-fjord-pale rounded-lg shadow hover:shadow-md transition-shadow duration-300 p-6 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
                <h2 class="text-xl md:text-2xl font-medium leading-[1.2] tracking-[-0.015em] text-balance mt-0 mb-3 text-gray-900">
                    {{ .Title }}
                </h2>
                {{- with .Params.description }}
                <p class="text-base leading-relaxed text-gray-700 mb-3">{{ . }}</p>
                {{- end }}
                {{- if not .Date.IsZero }}
                <p class="text-sm text-gray-700">
                    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format "2. January 2006" }}</time>
                </p>
                {{- end }}
            </a>
            {{ end }}
        </div>
    </div>
</section>

{{ end }}
