{{ define "main" }}

<!-- Tag Landing Page Hero -->
{{ if .Content }}
<section class="overflow-hidden" style="background-color: {{ .Params.color | default "#1d3640" }};">
    <div class="container">
        <h1 class="mt-0 mb-5 md:mb-6 text-3xl md:text-4xl lg:text-5xl font-medium tracking-tight text-balance text-white">{{ .Title }}</h1>
        <div class="text-lg md:text-xl leading-relaxed text-white max-w-none">
            {{ .Content }}
        </div>
    </div>
</section>
{{ end }}

<!-- Activities List (with filter above) -->
<section class="bg-fjord-light">
<div class="container">
    <!-- Filter Dropdown -->
    <div class="flex items-center gap-3 pb-3">
        <p class="text-base font-semibold text-gray-900">Filter:</p>
        <div class="relative">
            <button id="dropdownDefaultButton" data-dropdown-toggle="dropdown"
                class="inline-flex items-center gap-2 rounded-lg px-4 py-2 border border-fjord-pale bg-white hover:bg-fjord-light transition-colors duration-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
                type="button"
                aria-label="Filter activities by category"
                aria-haspopup="listbox"
                aria-expanded="false">
                <span class="text-xs font-semibold px-3 py-1.5 rounded-md text-white bg-category"
                    style="background-color: {{.Params.color | default "#1d3640"}};">
                    {{.Title}}
                </span>
                <svg class="w-4 h-4 text-gray-700" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 10 6">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 4 4 4-4" />
                </svg>
            </button>

            <!-- Dropdown menu -->
            {{ partial "components/tag-dropdown-menu" (dict "activePermalink" .RelPermalink) }}
        </div>
    </div>

    <hr class="mb-12 border-fjord-pale">

    <!-- Activities Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 justify-items-center">
        {{ range sort .Pages }}
            {{ .Render "li" }}
        {{ end }}
    </div>
</div>
</section>

<!-- See All Activities CTA -->
<section class="bg-white">
    <div class="container">
        {{ partial "activity/see-all-activities" . }}
    </div>
</section>

{{ end }}
