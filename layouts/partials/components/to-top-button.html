{{/*
  Project override of the theme partial
  (themes/balevikit-tailwindcss-hugo-theme/layouts/partials/components/to-top-button.html).

  Changes:
  1. cursor-pointer. Tailwind v4's preflight no longer gives <button> a pointer
     cursor, so the browser draws the default arrow; the theme sets no cursor on
     this control either. The button is hidden until the page is scrolled, which
     is why it is easy to miss when auditing the header and footer.

  Everything else (markup, aria-label, visibility after 100px of scroll,
  smooth scroll to top) is unchanged.
*/}}
<button onclick="scrollToTop()" id="scroll-to-top" data-backstop-hide="scroll-to-top"
        aria-label="{{ i18n "scrollToTop" | default "Gå til toppen" }}"
        class="scroll-to-top fixed bottom-4 right-4 z-50
               rounded-full bg-primary text-white shadow
               hover:bg-primary/90 active:bg-primary/80
               transition-all duration-300 p-3 cursor-pointer
               focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
    <i data-lucide="arrow-up" class="w-6 h-6" aria-hidden="true"></i>
</button>


<script>
    const scrollToTopButton =
        document.getElementById('scroll-to-top');

    scrollToTopButton.style.display = 'none';

    window.addEventListener('scroll', () => {
        if (window.pageYOffset > 100) {
            scrollToTopButton.style.display = 'block';
        } else {
            scrollToTopButton.style.display = 'none';
        }
    });

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
</script>
