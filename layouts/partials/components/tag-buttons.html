{{/*
  Tag buttons grid — renders activity categories as large colored links.
  Usage: {{ partial "components/tag-buttons" . }}
*/}}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
    {{ range $name, $taxonomy := site.Taxonomies.tags }}
    {{ with site.GetPage (printf "/tags/%s" $name) }}
    <a href="{{ .RelPermalink }}"
       aria-label="View {{ .Title }} activities"
       class="group rounded-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
        <div class="relative overflow-hidden text-xl text-white p-6 text-center rounded-lg transition-colors duration-300 shadow-sm border border-black/5"
             style="background-color: {{ .Params.color | default "#1d3640" }};">
            <div class="inline-flex items-center gap-2">
                <span>{{ .Title }}</span>
                <svg class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-0.5"
                     aria-hidden="true"
                     xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 12H5m14 0-4 4m4-4-4-4"/>
                </svg>
            </div>
        </div>
    </a>
    {{ end }}
    {{ end }}
</div>
