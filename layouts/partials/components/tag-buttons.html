{{/*
  Tag links — simple shortcuts to activity categories.
  Usage: {{ partial "components/tag-buttons" . }}
*/}}
<div class="flex flex-wrap gap-3">
    {{ range $name, $taxonomy := site.Taxonomies.tags }}
    {{ with site.GetPage (printf "/tags/%s" $name) }}
    <a href="{{ .RelPermalink }}"
       aria-label="View {{ .Title }} activities"
       class="rounded-lg border border-fjord-pale px-4 py-3 text-gray-900 no-underline hover:bg-fjord-light transition-colors duration-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
        {{ .Title }}
    </a>
    {{ end }}
    {{ end }}
</div>
