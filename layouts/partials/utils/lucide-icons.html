<script>
  (function () {
    const icons = {
      "arrow-up": '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
      "globe": '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
      "chevron-down": '<path d="m6 9 6 6 6-6"/>',
      "menu": '<path d="M4 6h16M4 12h16M4 18h16"/>',
      "x": '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
      "arrow-left": '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
      "loader-2": '<path d="M21 12a9 9 0 1 1-6.2-8.56"/>',
      "maximize": '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
      "chevron-left": '<path d="m15 18-6-6 6-6"/>',
      "chevron-right": '<path d="m9 18 6-6-6-6"/>',
      "clock": '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      "calendar": '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>'
    };

    function renderIcon(el, name) {
      const paths = icons[name];
      if (!paths) return;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      const classes = el.getAttribute("class");
      if (classes) svg.setAttribute("class", classes);
      if (el.getAttribute("aria-hidden")) svg.setAttribute("aria-hidden", el.getAttribute("aria-hidden"));
      if (el.getAttribute("role")) svg.setAttribute("role", el.getAttribute("role"));

      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.innerHTML = paths;

      el.replaceWith(svg);
    }

    window.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("[data-lucide]").forEach(function (el) {
        renderIcon(el, el.getAttribute("data-lucide"));
      });
    });
  })();
</script>
