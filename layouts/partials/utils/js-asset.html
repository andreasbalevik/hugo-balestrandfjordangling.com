{{/*
  JS asset loader for a single bundled entry point.

  Renders <script defer> for the asset at `src` (relative to assets/).
  Development builds are unminified with no fingerprint; all other
  environments minify, fingerprint and add SRI integrity + crossorigin.
  A missing resource renders nothing, like the callers' original with-block.
*/}}
{{- with resources.Get .src }}
  {{- if eq hugo.Environment "development" }}
    {{- with . | js.Build }}
      <script defer src="{{ .RelPermalink }}"></script>
    {{- end }}
  {{- else }}
    {{- $opts := dict "minify" true }}
    {{- with . | js.Build $opts | fingerprint }}
      <script defer src="{{ .RelPermalink }}" integrity="{{- .Data.Integrity }}" crossorigin="anonymous"></script>
    {{- end }}
  {{- end }}
{{- end -}}
